<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .section {
            display: none;
        }
        .active {
            display: block;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <!-- HOME SECTION -->
    <div id="home" class="section active">
        <h1>Welcome to My Website</h1>
        <button onclick="showSection('about')">About Me</button>
        <button onclick="showSection('contact')">Contact Me</button>
    </div>

    <!-- ABOUT SECTION -->
    <div id="about" class="section">
        <h2>About Me</h2>
        <p><b>Name:</b> Aadil Shabir</p>
        <p><b>From:</b> Sopore</p>
        <p><b>Branch:</b> Electronics and Communication Engineering</p>
        <p><b>College:</b> Kashmir Govt Polytechnic College, Srinagar</p>
        <button onclick="showSection('home')">Back to Home</button>
    </div>

    <!-- CONTACT SECTION -->
    <div id="contact" class="section">
        <h2>Contact Me</h2>
        <p><b>Email:</b> aadil@example.com</p>
        <p><b>Phone:</b> 1234567890</p>
        <button onclick="showSection('home')">Back to Home</button>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }
    </script>

</body>
</html>
